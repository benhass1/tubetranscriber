name = "tubetranscriber-transcript-proxy"
main = "worker.js"
compatibility_date = "2026-08-26"

[vars]
APP_VERSION = "transcript-worker-v1"

# Configure YOUTUBE_PLAYER_API_KEY as an account-side variable or encrypted secret.
# Configure TRANSCRIPT_CACHE as an account-side KV binding.
# Cloudflare edge Managed Challenge is configured in the tubetranscriber.com WAF;
# no in-app Turnstile secret or token is required by the transcript route.
# Never commit account secrets or namespace IDs to this repository.

# Example account-side binding (leave IDs out of source control):
# [[kv_namespaces]]
# binding = "TRANSCRIPT_CACHE"
# id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_KV_PREVIEW_NAMESPACE_ID"
