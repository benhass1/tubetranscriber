<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TubeTranscriber Capture</title>
    <style>
      body { width: 280px; margin: 0; padding: 18px; font: 14px/1.45 system-ui, sans-serif; color: #0f172a; }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { color: #475569; margin: 0 0 14px; }
      button { width: 100%; border: 0; border-radius: 10px; padding: 11px 14px; color: white; background: #2563eb; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 42px; margin-top: 12px; font-size: 13px; }
      .ok { color: #166534; } .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>TubeTranscriber Capture</h1>
    <p>Open a YouTube video, then capture the transcript visible in its transcript panel.</p>
    <button id="capture" type="button">Capture transcript</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
