services:
  - type: web
    name: tubetranscriber
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CANONICAL_ORIGIN
        sync: false
      - key: WARP_ENABLED
        value: "true"
      - key: WARP_REQUIRED
        value: "true"
      - key: WARP_HTTP_PROXY
        value: http://127.0.0.1:9091
      - key: PO_TOKEN_ENABLED
        value: "true"
      - key: PO_TOKEN_PORT
        value: "4416"
      - key: PO_TOKEN_SIDECAR_URL
        value: http://127.0.0.1:4416
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
