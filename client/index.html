<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Extract available YouTube captions, search the transcript, and download TXT, JSON, or SRT files with TubeTranscriber." />
    <meta name="revised" content="2026-08-23" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://tubetranscriber.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tubetranscriber.com/#organization",
            "name": "TubeTranscriber",
            "url": "https://tubetranscriber.com/",
            "logo": "https://tubetranscriber.com/favicon.svg",
            "sameAs": [
              "https://github.com/benhass1/tubetranscriber",
              "https://x.com/tubetranscriber",
              "https://www.linkedin.com/company/tubetranscriber",
              "https://www.youtube.com/@TubeTranscriber"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://tubetranscriber.com/#website",
            "name": "TubeTranscriber",
            "url": "https://tubetranscriber.com/",
            "author": { "@type": "Organization", "name": "TubeTranscriber Team" },
            "publisher": { "@id": "https://tubetranscriber.com/#organization" },
            "datePublished": "2026-08-12",
            "dateModified": "2026-08-23",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://tubetranscriber.com/?url={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
